name: test

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        node-version: [26.13.0]
        vueuse-version: [14.4.0, 15.0.0]
        querry-kit-version: [0.2.10, 1.0.0]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install VueUse and Query Kit compatibility fixtures
        run: pnpm add -D @querry-kit/nuxt@${{ matrix.querry-kit-version }} @vueuse/core@${{ matrix.vueuse-version }} @vueuse/router@${{ matrix.vueuse-version }} --ignore-scripts

      - name: Check supported VueUse types and package build
        run: |
          pnpm typecheck
          pnpm build

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-node-${{ matrix.node-version }}-vueuse-${{ matrix.vueuse-version }}-querry-kit-${{ matrix.querry-kit-version }}
          path: coverage
          if-no-files-found: error
